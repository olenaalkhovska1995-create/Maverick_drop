<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MVRK STORE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141416;
    --ink-soft:#3a3a3f;
    --paper:#F3F1EA;
    --card-cream:#FBFAF6;
    --yellow:#FFC72C;
    --yellow-deep:#E9AE00;
    --navy:#1B2130;
    --line: rgba(20,20,22,.14);
    --white:#ffffff;
    --danger:#C6432B;
    --radius: 2px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  h1,h2,h3,.display{
    font-family:'Space Grotesk',system-ui,sans-serif;
  }
  a{color:inherit;}

  /* ---------- Header ---------- */
  header{
    position:sticky; top:0; z-index:40;
    background:var(--ink);
    color:var(--white);
    border-bottom:1px solid #000;
  }
  .header-inner{
    max-width:1180px; margin:0 auto;
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 24px;
  }
  .logo{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:0.02em;
    display:flex; align-items:center; gap:10px;
  }
  .logo .dot{width:9px;height:9px;background:var(--yellow);border-radius:50%;display:inline-block;}
  .cart-btn{
    background:var(--yellow);
    color:var(--ink);
    border:none;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    padding:11px 18px;
    cursor:pointer;
    display:flex; align-items:center; gap:10px;
    border-radius:var(--radius);
    transition:transform .12s ease;
  }
  .cart-btn:hover{transform:translateY(-1px);}
  .cart-count{
    background:var(--ink);
    color:var(--yellow);
    min-width:20px; height:20px;
    border-radius:50%;
    font-size:12px;
    display:flex; align-items:center; justify-content:center;
    padding:0 5px;
  }

  /* ---------- Hero ---------- */
  .hero{
    max-width:1180px; margin:0 auto;
    padding:64px 24px 40px;
  }
  .hero-kicker{
    font-size:14px; color:var(--ink-soft); margin-bottom:14px;
  }
  .hero h1{
    font-size:clamp(34px,6vw,64px);
    line-height:1.02;
    font-weight:700;
    margin:0 0 18px;
    max-width:14ch;
  }
  .hero p{
    font-size:17px; line-height:1.55; color:var(--ink-soft);
    max-width:46ch; margin:0;
  }

  /* ---------- Catalog ---------- */
  .catalog-head{
    max-width:1180px; margin:0 auto;
    padding:0 24px 20px;
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:1px solid var(--line);
    padding-bottom:14px;
  }
  .catalog-head h2{font-size:15px; text-transform:uppercase; letter-spacing:.08em; font-weight:700; margin:0;}
  .catalog-head span{font-size:14px; color:var(--ink-soft);}

  .grid{
    max-width:1180px; margin:0 auto;
    padding:28px 24px 90px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
  }
  @media(max-width:980px){ .grid{grid-template-columns:repeat(2,1fr);} }
  @media(max-width:560px){ .grid{grid-template-columns:1fr;} }

  .card{
    background:var(--card-cream);
    display:flex; flex-direction:column;
  }
  .card-visual{
    aspect-ratio:1/1;
    display:flex; align-items:center; justify-content:center;
    font-size:64px;
  }
  .card-body{
    padding:18px 18px 20px;
    border-top:1px solid var(--line);
    display:flex; flex-direction:column; gap:12px; flex:1;
  }
  .card-name{font-weight:600; font-size:15px; margin:0;}
  .card-desc{font-size:13px; color:var(--ink-soft); margin:0; line-height:1.4;}
  .card-foot{
    margin-top:auto;
    display:flex; align-items:center; gap:8px;
  }
  .card-price{font-weight:700; font-size:16px; margin-right:auto;}
  select.size-select{
    font-family:'Inter',sans-serif;
    font-size:13px;
    padding:8px 8px;
    border:1px solid var(--ink);
    background:var(--white);
    border-radius:var(--radius);
    cursor:pointer;
  }
  .add-btn{
    background:var(--ink);
    color:var(--white);
    border:none;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    padding:9px 14px;
    cursor:pointer;
    border-radius:var(--radius);
    white-space:nowrap;
    transition:background .12s ease;
  }
  .add-btn:hover{background:#000;}
  .add-btn.added{background:var(--yellow); color:var(--ink);}

  /* ---------- Cart drawer ---------- */
  .scrim{
    position:fixed; inset:0; background:rgba(10,10,10,.4);
    opacity:0; pointer-events:none; transition:opacity .2s ease;
    z-index:50;
  }
  .scrim.open{opacity:1; pointer-events:auto;}
  .drawer{
    position:fixed; top:0; right:0; height:100%;
    width:min(420px,100%);
    background:var(--white);
    z-index:60;
    transform:translateX(100%);
    transition:transform .28s cubic-bezier(.2,.8,.2,1);
    display:flex; flex-direction:column;
    border-left:1px solid var(--ink);
  }
  .drawer.open{transform:translateX(0);}
  .drawer-head{
    padding:22px 22px 18px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--line);
  }
  .drawer-head h3{margin:0; font-size:17px; letter-spacing:.02em; text-transform:uppercase;}
  .close-btn{
    background:none; border:none; font-size:20px; cursor:pointer; color:var(--ink);
    line-height:1; padding:4px;
  }
  .drawer-items{flex:1; overflow-y:auto; padding:6px 22px;}
  .drawer-empty{
    padding:60px 0; text-align:center; color:var(--ink-soft); font-size:14px;
  }
  .line-item{
    display:flex; gap:12px; padding:16px 0; border-bottom:1px solid var(--line);
  }
  .line-visual{
    width:52px; height:52px; background:var(--paper);
    display:flex; align-items:center; justify-content:center;
    font-size:26px; flex-shrink:0;
  }
  .line-info{flex:1; min-width:0;}
  .line-name{font-weight:600; font-size:14px; margin:0 0 2px;}
  .line-meta{font-size:12px; color:var(--ink-soft); margin:0;}
  .line-qty{
    display:flex; align-items:center; gap:8px; margin-top:8px;
  }
  .qty-btn{
    width:22px; height:22px; border:1px solid var(--ink); background:var(--white);
    cursor:pointer; font-size:13px; line-height:1; border-radius:var(--radius);
  }
  .line-price{font-weight:700; font-size:14px; white-space:nowrap;}
  .remove-btn{
    background:none; border:none; color:var(--ink-soft); font-size:12px;
    cursor:pointer; text-decoration:underline; padding:0; margin-top:8px;
  }
  .drawer-foot{
    padding:20px 22px 24px;
    border-top:1px solid var(--line);
  }
  .contact-fields{
    display:flex; flex-direction:column; gap:10px;
    margin-bottom:18px;
  }
  .contact-fields label{
    font-size:12px; color:var(--ink-soft); display:block; margin-bottom:5px;
  }
  .contact-fields input{
    width:100%;
    font-family:'Inter',sans-serif;
    font-size:14px;
    padding:10px 11px;
    border:1px solid var(--ink);
    border-radius:var(--radius);
    background:var(--white);
  }
  .contact-fields input.invalid{
    border-color:var(--danger);
  }
  .total-row{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:15px; margin-bottom:16px;
  }
  .total-row strong{font-size:20px; font-family:'Space Grotesk',sans-serif;}
  .checkout-btn{
    width:100%; background:var(--yellow); color:var(--ink);
    border:none; font-family:'Inter',sans-serif; font-weight:700; font-size:14px;
    padding:15px; cursor:pointer; border-radius:var(--radius);
    letter-spacing:.02em; text-transform:uppercase;
    transition:background .15s ease;
  }
  .checkout-btn:hover{background:var(--yellow-deep);}
  .checkout-btn:disabled{background:#ddd; color:#999; cursor:default;}
  .checkout-msg{
    margin-top:12px; font-size:13px; text-align:center;
  }
  .checkout-msg.ok{color:#2E7D32;}
  .checkout-msg.err{color:var(--danger);}

  footer{
    border-top:1px solid var(--line);
    padding:30px 24px; text-align:center;
    font-size:12px; color:var(--ink-soft);
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo"><span class="dot"></span>MVRK STORE</div>
    <button class="cart-btn" id="cartOpenBtn">
      Кошик <span class="cart-count" id="cartCount">0</span>
    </button>
  </div>
</header>

<section class="hero">
  <div class="hero-kicker">Дроп триває — розміри йдуть швидко</div>
  <h1>Одяг для тих, хто рухається проти потоку</h1>
  <p>Щільна бавовна, оверсайз крій, мінімум лейблів. Обирай розмір і додавай у кошик — оформлення в два кліки.</p>
</section>

<div class="catalog-head">
  <h2>Каталог</h2>
  <span id="itemsCountLabel">8 товарів</span>
</div>

<div class="grid" id="grid"></div>

<footer>MVRK STORE — власне виробництво · доставка по Україні 1–3 дні</footer>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <h3>Мій кошик</h3>
    <button class="close-btn" id="closeDrawerBtn">✕</button>
  </div>
  <div class="drawer-items" id="drawerItems"></div>
  <div class="drawer-foot">
    <div class="contact-fields">
      <div>
        <label for="custName">Ім'я та прізвище</label>
        <input type="text" id="custName" placeholder="Олена Коваленко">
      </div>
      <div>
        <label for="custPhone">Телефон</label>
        <input type="tel" id="custPhone" placeholder="+380 XX XXX XX XX">
      </div>
      <div>
        <label for="custEmail">Електронна пошта</label>
        <input type="email" id="custEmail" placeholder="you@example.com">
      </div>
      <div>
        <label for="custAddress">Адреса доставки (місто, відділення НП)</label>
        <input type="text" id="custAddress" placeholder="Київ, відділення №12">
      </div>
    </div>
    <div class="total-row"><span>Разом</span><strong id="totalLabel">0 ₴</strong></div>
    <button class="checkout-btn" id="checkoutBtn">Оформити замовлення</button>
    <div class="checkout-msg" id="checkoutMsg"></div>
  </div>
</aside>

<script>
const WEBHOOK_URL = "https://danit-n8n.duckdns.org/webhook-test/ee8e1964-a56f-47b5-b11f-a570a440a45a";

const PRODUCTS = [
  { id:"hoodie",   name:"Худі MVRK",       desc:"Оверсайз, 320г/м², унісекс",   price:899, emoji:"🧥", bg:"var(--yellow)", sizes:["XS","S","M","L","XL"] },
  { id:"tshirt",   name:"Футболка DROP",   desc:"100% бавовна, щільна",         price:449, emoji:"👕", bg:"var(--card-cream)", sizes:["XS","S","M","L","XL"] },
  { id:"cap",      name:"Кепка MVRK",      desc:"6-панельна, регульована",      price:349, emoji:"🧢", bg:"var(--navy)", sizes:["ONE SIZE"] },
  { id:"longsl",   name:"Лонгслів BASE",   desc:"Оверсайз, рибана манжета",     price:549, emoji:"🎽", bg:"var(--card-cream)", sizes:["XS","S","M","L","XL"] },
  { id:"shorts",   name:"Шорти FIELD",     desc:"Легка тканина, кишені-карго",  price:599, emoji:"🩳", bg:"var(--card-cream)", sizes:["S","M","L","XL"] },
  { id:"sweater",  name:"Светр HEAVY",     desc:"470г/м², щільна в'язка",       price:999, emoji:"🧶", bg:"var(--yellow)", sizes:["S","M","L","XL"] },
  { id:"socks",    name:"Шкарпетки SIGNAL",desc:"Набір 3 пари, бавовна",        price:199, emoji:"🧦", bg:"var(--card-cream)", sizes:["ONE SIZE"] },
  { id:"bag",      name:"Сумка CARRY",     desc:"Кордура, водовідштовх.",       price:749, emoji:"🎒", bg:"var(--navy)", sizes:["ONE SIZE"] },
];

let cart = []; // {id, name, price, emoji, size, qty}

const grid = document.getElementById('grid');
PRODUCTS.forEach(p => {
  const card = document.createElement('div');
  card.className = 'card';
  const sizeOptions = p.sizes.map(s => `<option value="${s}">${s}</option>`).join('');
  const isDark = p.bg === "var(--navy)";
  card.innerHTML = `
    <div class="card-visual" style="background:${p.bg};${isDark ? 'filter:none;' : ''}">${p.emoji}</div>
    <div class="card-body">
      <p class="card-name">${p.name}</p>
      <p class="card-desc">${p.desc}</p>
      <div class="card-foot">
        <span class="card-price">${p.price} ₴</span>
        <select class="size-select" data-id="${p.id}">${sizeOptions}</select>
        <button class="add-btn" data-id="${p.id}">+ В кошик</button>
      </div>
    </div>
  `;
  grid.appendChild(card);
});

grid.addEventListener('click', (e) => {
  if(!e.target.classList.contains('add-btn')) return;
  const id = e.target.dataset.id;
  const product = PRODUCTS.find(p => p.id === id);
  const select = grid.querySelector(`select[data-id="${id}"]`);
  const size = select.value;
  const existing = cart.find(c => c.id === id && c.size === size);
  if(existing){ existing.qty += 1; }
  else { cart.push({ id, name:product.name, price:product.price, emoji:product.emoji, size, qty:1 }); }
  renderCart();
  e.target.textContent = "Додано ✓";
  e.target.classList.add('added');
  setTimeout(() => { e.target.textContent = "+ В кошик"; e.target.classList.remove('added'); }, 900);
});

const drawer = document.getElementById('drawer');
const scrim = document.getElementById('scrim');
const drawerItems = document.getElementById('drawerItems');
const cartCount = document.getElementById('cartCount');
const totalLabel = document.getElementById('totalLabel');
const checkoutBtn = document.getElementById('checkoutBtn');
const checkoutMsg = document.getElementById('checkoutMsg');

document.getElementById('cartOpenBtn').addEventListener('click', () => openDrawer());
document.getElementById('closeDrawerBtn').addEventListener('click', () => closeDrawer());
scrim.addEventListener('click', () => closeDrawer());

function openDrawer(){ drawer.classList.add('open'); scrim.classList.add('open'); }
function closeDrawer(){ drawer.classList.remove('open'); scrim.classList.remove('open'); }

function renderCart(){
  const totalQty = cart.reduce((s,c) => s + c.qty, 0);
  cartCount.textContent = totalQty;

  if(cart.length === 0){
    drawerItems.innerHTML = `<div class="drawer-empty">Кошик порожній</div>`;
  } else {
    drawerItems.innerHTML = cart.map((c, idx) => `
      <div class="line-item">
        <div class="line-visual">${c.emoji}</div>
        <div class="line-info">
          <p class="line-name">${c.name}</p>
          <p class="line-meta">Розмір: ${c.size}</p>
          <div class="line-qty">
            <button class="qty-btn" data-action="dec" data-idx="${idx}">−</button>
            <span>${c.qty}</span>
            <button class="qty-btn" data-action="inc" data-idx="${idx}">+</button>
          </div>
          <button class="remove-btn" data-action="remove" data-idx="${idx}">Видалити</button>
        </div>
        <div class="line-price">${c.price * c.qty} ₴</div>
      </div>
    `).join('');
  }

  const total = cart.reduce((s,c) => s + c.price * c.qty, 0);
  totalLabel.textContent = total + " ₴";
  checkoutBtn.disabled = cart.length === 0;
  checkoutMsg.textContent = "";
  checkoutMsg.className = "checkout-msg";
}

drawerItems.addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if(!btn) return;
  const idx = Number(btn.dataset.idx);
  const action = btn.dataset.action;
  if(action === 'inc') cart[idx].qty += 1;
  if(action === 'dec'){ cart[idx].qty -= 1; if(cart[idx].qty <= 0) cart.splice(idx,1); }
  if(action === 'remove') cart.splice(idx,1);
  renderCart();
});

const nameInput = document.getElementById('custName');
const phoneInput = document.getElementById('custPhone');
const emailInput = document.getElementById('custEmail');
const addressInput = document.getElementById('custAddress');

function validateContactFields(){
  let ok = true;
  [nameInput, phoneInput, emailInput, addressInput].forEach(input => {
    if(input.value.trim() === ""){
      input.classList.add('invalid');
      ok = false;
    } else {
      input.classList.remove('invalid');
    }
  });
  if(ok && emailInput.value.trim() !== "" && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailInput.value.trim())){
    emailInput.classList.add('invalid');
    ok = false;
  }
  return ok;
}

checkoutBtn.addEventListener('click', async () => {
  if(cart.length === 0) return;

  checkoutMsg.textContent = "";
  checkoutMsg.className = "checkout-msg";

  if(!validateContactFields()){
    checkoutMsg.textContent = "Заповніть ім'я, телефон, e-mail і адресу доставки (перевірте формат e-mail).";
    checkoutMsg.classList.add('err');
    return;
  }

  checkoutBtn.disabled = true;
  checkoutBtn.textContent = "Надсилаємо...";

  const payload = {
    customer: {
      name: nameInput.value.trim(),
      phone: phoneInput.value.trim(),
      email: emailInput.value.trim(),
      address: addressInput.value.trim()
    },
    items: cart.map(c => ({ id:c.id, name:c.name, size:c.size, qty:c.qty, price:c.price, subtotal:c.price*c.qty })),
    total: cart.reduce((s,c) => s + c.price * c.qty, 0),
    createdAt: new Date().toISOString()
  };

  try {
    const res = await fetch(WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    if(!res.ok) throw new Error("HTTP " + res.status);
    checkoutMsg.textContent = "Замовлення оформлено! Ми зв'яжемось з вами.";
    checkoutMsg.classList.add('ok');
    cart = [];
    nameInput.value = ""; phoneInput.value = ""; emailInput.value = ""; addressInput.value = "";
    renderCart();
    setTimeout(closeDrawer, 1800);
  } catch(err){
    console.error("Checkout request failed:", err);
    if(err instanceof TypeError){
      // A TypeError from fetch almost always means the request never reached
      // the server: either it's blocked by CORS, or the webhook URL isn't
      // actively listening (n8n test webhooks fire once, until you click
      // "Listen for test event" again, or you switch to the production URL).
      checkoutMsg.textContent = "Сервер не відповів. Перевірте, чи активний webhook у n8n (для тестового URL натисніть «Listen for test event» перед кожною спробою, або перейдіть на продакшн URL і дозвольте CORS у налаштуваннях ноди).";
    } else {
      checkoutMsg.textContent = "Не вдалось відправити замовлення (" + err.message + "). Спробуйте ще раз.";
    }
    checkoutMsg.classList.add('err');
  } finally {
    checkoutBtn.disabled = cart.length === 0;
    checkoutBtn.textContent = "Оформити замовлення";
  }
});

renderCart();
</script>
</body>
</html>
